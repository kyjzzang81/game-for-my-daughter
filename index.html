<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>동화 놀이터</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--sky:#bfe8ff;--grass:#8fd46b;--ink:#5a3a2e;--pink:#ff9fb8;--yellow:#ffd65c;--card:#fffaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Jua',sans-serif;color:var(--ink);background:var(--sky)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.screen.on{display:flex;animation:fade .4s}
@keyframes fade{from{opacity:0}to{opacity:1}}
button{font-family:inherit;border:none;cursor:pointer;color:var(--ink)}
.big{font-size:clamp(26px,5vw,44px);padding:18px 54px;border-radius:999px;background:var(--yellow);box-shadow:0 8px 0 #d9a92a;transition:transform .1s}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #d9a92a}
.icon-btn{position:absolute;top:16px;width:64px;height:64px;border-radius:50%;background:#fff;font-size:30px;box-shadow:0 5px 0 #0002;z-index:20}
.icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0002}
/* 공통 배경 */
.bg{position:absolute;inset:0;background:linear-gradient(#aee3ff 0%,#dff5ff 60%,var(--grass) 60%,#6fbf4f 100%);z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50%;height:160%;left:15%;top:-70%}.cloud::after{width:35%;height:120%;left:50%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.sun{position:absolute;right:6%;top:6%;width:90px;height:90px;border-radius:50%;background:#ffe066;box-shadow:0 0 0 14px #ffe06655,0 0 0 28px #ffe06622;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.flower{position:absolute;font-size:28px}
/* 홈 */
.title{font-size:clamp(48px,11vw,110px);margin:0;color:#ff7aa2;text-shadow:0 6px 0 #fff,0 10px 0 #0001;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.sub{font-size:clamp(20px,3.5vw,30px);margin:6px 0 34px}
.home-friends{font-size:clamp(50px,9vw,90px);margin-bottom:26px}
.home-friends span{display:inline-block;animation:bob 2s ease-in-out infinite}
.home-friends span:nth-child(2){animation-delay:.3s}.home-friends span:nth-child(3){animation-delay:.6s}
/* 게임 선택 */
.select-title{font-size:clamp(30px,6vw,52px);margin:0 0 28px;text-shadow:0 4px 0 #fff}
.cards{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.card{width:min(240px,42vw);background:var(--card);border-radius:32px;padding:22px 14px;text-align:center;box-shadow:0 10px 0 #0002;font-size:clamp(20px,3.4vw,28px);position:relative;transition:transform .15s}
.card .art{font-size:clamp(56px,10vw,86px);line-height:1.2}
.card.play{border:6px solid var(--pink);animation:wiggle 3s ease-in-out infinite}
.card.play:active{transform:scale(.95)}
@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-3deg)}96%{transform:rotate(3deg)}}
.card.lock{opacity:.6;filter:grayscale(.7)}
.card .tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:4px 14px;font-size:16px;box-shadow:0 3px 0 #0002;white-space:nowrap}
/* 게임 */
#game{justify-content:flex-start}
.story{margin-top:92px;max-width:min(860px,92vw);background:#fffdf5ee;border-radius:28px;padding:16px 28px;font-size:clamp(22px,4vw,34px);text-align:center;box-shadow:0 6px 0 #0001;line-height:1.4;z-index:5}
.hint{margin-top:10px;font-size:clamp(18px,3vw,26px);background:#fff;border-radius:999px;padding:6px 22px;animation:bob 1.6s ease-in-out infinite;z-index:5}
.stage{position:absolute;left:0;right:0;bottom:0;top:0;pointer-events:none}
.stage > *{pointer-events:auto}
.actor{position:absolute;font-size:clamp(70px,13vw,130px);line-height:1;cursor:pointer;transition:left 1s ease-in-out,transform .3s;transform-origin:bottom center}
.actor:active{transform:scale(.9)}
.tapme{animation:tapme 1.1s ease-in-out infinite}
@keyframes tapme{0%,100%{transform:scale(1)}50%{transform:scale(1.14) rotate(-4deg)}}
.happy{animation:jump .5s ease-in-out 2}
@keyframes jump{50%{transform:translateY(-40px)}}
.dance{animation:dance .8s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(10deg) translateY(-24px)}}
.shake{animation:shake .12s linear 6}
@keyframes shake{25%{transform:translateX(-10px) rotate(-3deg)}75%{transform:translateX(10px) rotate(3deg)}}
.fly{animation:fly 1.4s ease-in forwards}
@keyframes fly{to{transform:translate(70vw,-80vh) rotate(720deg) scale(.2);opacity:0}}
.runaway{transition:left 1.6s ease-in!important}
.bubble{position:absolute;background:#fff;border-radius:22px;padding:8px 16px;font-size:clamp(18px,3vw,26px);box-shadow:0 4px 0 #0002;white-space:nowrap;animation:pop .3s;pointer-events:none;z-index:8}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.house{position:absolute;width:clamp(200px,32vw,320px);bottom:14%;left:50%;transform:translateX(-50%);transform-origin:bottom center}
.house .part{opacity:0;transform:scale(.3);transform-origin:center bottom;transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.house .part.show{opacity:1;transform:scale(1)}
.item{position:absolute;font-size:clamp(50px,8vw,80px);cursor:pointer;filter:drop-shadow(0 6px 0 #0002)}
.item.used{animation:toHouse .5s ease-in forwards;pointer-events:none}
@keyframes toHouse{to{transform:scale(.2) translateY(-60px);opacity:0}}
.wind{position:absolute;font-size:50px;pointer-events:none;animation:wind 1s ease-out forwards}
@keyframes wind{from{transform:scaleX(-1)}to{transform:translateX(40vw) scaleX(-1);opacity:0}}
.spark{position:absolute;pointer-events:none;font-size:34px;animation:spark 1s ease-out forwards;z-index:9}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg);opacity:0}}
.next{position:absolute;right:24px;bottom:24px;width:110px;height:110px;border-radius:50%;background:var(--pink);font-size:56px;color:#fff;box-shadow:0 8px 0 #d9748f;display:none;z-index:20;animation:tapme 1s infinite}
.next.on{display:block}
.progress{position:absolute;top:28px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20}
.progress i{width:18px;height:18px;border-radius:50%;background:#fff8;border:3px solid #fff}
.progress i.done{background:var(--yellow)}
</style>
</head>
<body>

<div class="bg" id="bg">
  <div class="sun"></div>
  <div class="cloud" style="width:160px;height:50px;top:14%;animation-delay:-5s"></div>
  <div class="cloud" style="width:110px;height:36px;top:26%;animation-delay:-22s;animation-duration:55s"></div>
  <div class="flower" style="left:6%;bottom:6%">🌷</div><div class="flower" style="left:20%;bottom:16%">🌼</div>
  <div class="flower" style="right:10%;bottom:10%">🌸</div><div class="flower" style="right:30%;bottom:4%">🌼</div>
</div>

<!-- 홈 -->
<section class="screen on" id="home">
  <div class="home-friends"><span>🐷</span><span>🐰</span><span>🐻</span></div>
  <h1 class="title">동화 놀이터</h1>
  <div class="sub">이야기 속으로 놀러 가요!</div>
  <button class="big" id="startBtn">▶ 시작하기</button>
</section>

<!-- 게임 선택 -->
<section class="screen" id="select">
  <button class="icon-btn" style="left:16px" data-go="home" aria-label="홈">🏠</button>
  <h2 class="select-title">어떤 이야기를 볼까?</h2>
  <div class="cards">
    <div class="card play" id="pigsCard"><span class="tag">⭐ 놀이 가능</span><div class="art">🐷🐺</div>아기 돼지<br>삼형제</div>
    <div class="card lock"><span class="tag">🔒 곧 만나요</span><div class="art">👧🍎</div>빨간 모자</div>
    <div class="card lock"><span class="tag">🔒 곧 만나요</span><div class="art">☀️🌙</div>해님 달님</div>
  </div>
</section>

<!-- 게임 진행 -->
<section class="screen" id="game">
  <button class="icon-btn" style="left:16px" data-go="select" aria-label="뒤로">⬅️</button>
  <button class="icon-btn" style="right:16px" id="replay" aria-label="다시 듣기">🔊</button>
  <div class="progress" id="progress"></div>
  <div class="story" id="story"></div>
  <div class="hint" id="hint"></div>
  <div class="stage" id="stage"></div>
  <button class="next" id="next" aria-label="다음">➜</button>
</section>

<script>
/* ---------- 소리 ---------- */
const AC = window.AudioContext || window.webkitAudioContext; let ac;
function tone(f=600, d=.15, type='sine', slide=0){
  try{ ac = ac || new AC(); const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=f; if(slide) o.frequency.linearRampToValueAtTime(f+slide, ac.currentTime+d);
    g.gain.setValueAtTime(.25, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+d);}catch(e){}
}
const sfx = {
  tap:()=>tone(700,.12,'triangle',200),
  pop:()=>{tone(500,.1,'sine',400); setTimeout(()=>tone(900,.12,'sine',300),90)},
  blow:()=>{for(let i=0;i<5;i++)setTimeout(()=>tone(200+Math.random()*100,.25,'sawtooth',-150),i*60)},
  yay:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle'),i*120)),
  oink:()=>{tone(300,.12,'square',-80); setTimeout(()=>tone(260,.14,'square',-80),140)},
};
/* ---------- 내레이션 ---------- */
let koVoice=null;
function loadVoice(){ const v=speechSynthesis.getVoices(); koVoice=v.find(x=>x.lang.startsWith('ko'))||null; }
if('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged=loadVoice; }
/* 목소리: 내레이터 / 첫째·둘째·막내 돼지(점점 높고 빠르게) / 늑대(낮고 느리게)
   이름 끝에 L을 붙이면 우렁찬 목소리(낮고 느리고 크게) */
const VOICES={narr:{pitch:1.15,rate:.85},pig1:{pitch:1.3,rate:.9},pig2:{pitch:1.65,rate:1},pig3:{pitch:2,rate:1.15},wolf:{pitch:.3,rate:.75}};
const HAS_TTS='speechSynthesis' in window;
function utter(text,who='narr'){
  const loud=who.endsWith('L'), v=VOICES[loud?who.slice(0,-1):who]||VOICES.narr;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.volume=1; u.rate=loud?.8:v.rate; u.pitch=loud?v.pitch*.6:v.pitch; if(koVoice) u.voice=koVoice;
  return u;
}
/* 대사 목록을 차례로 말해요. queue=false면 지금 말하던 걸 멈추고 새로 시작.
   (Chrome은 cancel 직후 바로 speak하면 소리가 씹히는 문제가 있어 잠깐 기다렸다가 말해요) */
let talkBuf=[], talkTimer=null;
function talk(lines,queue=false){
  if(!HAS_TTS){ lines.forEach((l,i)=>{ l.onstart&&setTimeout(l.onstart,i*900); l.onend&&setTimeout(l.onend,i*900+900); }); return; }
  if(!queue){ speechSynthesis.cancel(); talkBuf=[]; }
  talkBuf.push(...lines);
  if(!talkTimer) talkTimer=setTimeout(()=>{ talkTimer=null; speechSynthesis.resume();
    talkBuf.splice(0).forEach(l=>{ const u=utter(l.t,l.who); if(l.onstart)u.onstart=l.onstart;
      if(l.onend){ let fired=false; u.onend=u.onerror=()=>{ if(!fired){fired=true; l.onend();} }; }
      speechSynthesis.speak(u); });
  }, queue?0:100);
}
/* 문장 속 "따옴표" 부분은 who(등장인물) 목소리로, 나머지는 내레이터 목소리로 읽어요 */
function say(text,who='narr',queue=false){
  const lines=[];
  text.replace(/<[^>]+>/g,'').split(/("[^"]*")/).forEach(seg=>{
    if(!seg.trim()) return;
    if(seg.startsWith('"')) lines.push({t:seg.slice(1,-1),who:who==='narr'?'pig2':who});
    else lines.push({t:seg,who:'narr'});
  });
  talk(lines,queue);
}

/* ---------- 화면 이동 ---------- */
const $=id=>document.getElementById(id);
function go(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id!=='game' && 'speechSynthesis' in window) speechSynthesis.cancel(); }
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{sfx.tap(); go(b.dataset.go)});
$('startBtn').onclick=()=>{sfx.pop(); go('select'); say('어떤 이야기를 볼까?')};
document.querySelector('.card.lock') && document.querySelectorAll('.card.lock').forEach(c=>c.onclick=()=>{tone(300,.2,'triangle'); say('이 이야기는 곧 만나요!')});
$('pigsCard').onclick=()=>{sfx.pop(); startStory(PIGS)};

/* ---------- 도우미 ---------- */
const stage=$('stage');
function el(tag, cls, html, style={}){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; Object.assign(e.style,style); stage.appendChild(e); return e; }
/* flip=true면 좌우 반전(안쪽 span에 적용해서 통통 애니메이션과 겹치지 않게) */
function actor(emoji,left,bottom,flip){ return el('div','actor',flip?`<span style="display:inline-block;transform:scaleX(-1)">${emoji}</span>`:emoji,{left,bottom}); }
function showBubble(target,text,ms=1600){ const r=target.getBoundingClientRect();
  const b=el('div','bubble',text,{left:r.left+r.width/2-40+'px',top:r.top-50+'px'}); setTimeout(()=>b.remove(),ms); }
/* 말풍선 + 그 목소리로 말하기 */
function bubble(target,text,ms=1600,who,queue=false){ showBubble(target,text,ms); if(who) talk([{t:text,who}],queue); }
function sparkle(x,y,chars='⭐✨💖🌟'){ for(let i=0;i<10;i++){ const s=el('div','spark',[...chars][i%[...chars].length],
  {left:x+'px',top:y+'px'}); s.style.setProperty('--dx',(Math.random()-.5)*300+'px'); s.style.setProperty('--dy',(Math.random()-.8)*260+'px'); setTimeout(()=>s.remove(),1000);} }
function centerOf(e){const r=e.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]}
function replay(e){ e.classList.remove('happy','shake'); void e.offsetWidth; }

/* 집 그림 (SVG, 부분별로 나타남) */
const MAT={
  straw:{wall:'#f3d36b',line:'#d6a93a',roof:'#e8b93f',door:'#c98a2e'},
  wood:{wall:'#c98b52',line:'#8f5a2b',roof:'#9c5d2e',door:'#6b3d1c'},
  brick:{wall:'#d9573f',line:'#fbe3d3',roof:'#7a4b8c',door:'#5a3a2e'}};
function houseSVG(m){ const c=MAT[m]; let pattern='';
  if(m==='straw') for(let x=30;x<190;x+=14) pattern+=`<line x1="${x}" y1="100" x2="${x+4}" y2="190" stroke="${c.line}" stroke-width="3"/>`;
  if(m==='wood') for(let y=115;y<190;y+=22) pattern+=`<line x1="25" y1="${y}" x2="195" y2="${y}" stroke="${c.line}" stroke-width="4"/>`;
  if(m==='brick') for(let y=110,r=0;y<190;y+=16,r++) { pattern+=`<line x1="25" y1="${y}" x2="195" y2="${y}" stroke="${c.line}" stroke-width="3"/>`;
     for(let x=25+(r%2)*16;x<195;x+=32) pattern+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+16}" stroke="${c.line}" stroke-width="3"/>`; }
  return `<svg viewBox="0 0 220 200" width="100%">
  <g class="part"><rect x="25" y="95" width="170" height="100" rx="8" fill="${c.wall}"/>${pattern}</g>
  <g class="part"><path d="M10 105 L110 20 L210 105 Z" fill="${c.roof}" stroke="#0002" stroke-width="4" stroke-linejoin="round"/>${m==='brick'?'<rect x="150" y="30" width="24" height="45" fill="#d9573f"/>':''}</g>
  <g class="part"><rect x="90" y="130" width="42" height="65" rx="20" fill="${c.door}"/><circle cx="122" cy="165" r="4" fill="#ffd65c"/></g>
  <g class="part"><rect x="40" y="120" width="36" height="32" rx="6" fill="#bfe8ff" stroke="#fff" stroke-width="5"/><rect x="145" y="120" width="36" height="32" rx="6" fill="#bfe8ff" stroke="#fff" stroke-width="5"/></g>
  </svg>`; }
function house(m, left='50%', full=false, scale=1){
  const h=el('div','house',houseSVG(m),{left,transform:`translateX(-50%) scale(${scale})`});
  if(full) h.querySelectorAll('.part').forEach(p=>p.classList.add('show')); return h; }

/* ---------- 이야기 엔진 ---------- */
let story, idx;
function startStory(s){ story=s; idx=0; go('game');
  $('progress').innerHTML=s.map(()=>'<i></i>').join(''); runScene(); }
function runScene(){
  const sc=story[idx]; stage.innerHTML=''; $('next').classList.remove('on');
  $('progress').querySelectorAll('i').forEach((d,i)=>d.classList.toggle('done',i<=idx));
  $('story').innerHTML=sc.text; $('hint').textContent=sc.hint||''; $('hint').style.visibility=sc.hint?'visible':'hidden';
  say(sc.text,sc.who);
  let finished=false;
  sc.play(()=>{ if(finished||story[idx]!==sc) return; finished=true; $('hint').style.visibility='hidden'; if(sc.after){ $('story').innerHTML=sc.after; say(sc.after,sc.who,true);} setTimeout(()=>$('next').classList.add('on'),600); });
}
$('next').onclick=()=>{ sfx.pop(); idx++; if(idx<story.length) runScene(); else go('select'); };
$('replay').onclick=()=>{ sfx.tap(); say($('story').innerHTML,story[idx].who); };

/* 공통 장면: 재료를 톡톡 눌러 집 짓기 */
function buildScene(m, emoji, voice){
  return done=>{
    const h=house(m,'58%'); const pig=actor('🐷','10%','16%');
    const parts=h.querySelectorAll('.part'); let n=0;
    const spots=[['8%','52%'],['24%','40%'],['76%','46%'],['86%','30%']];
    spots.forEach(([l,t])=>{ const it=el('div','item tapme',emoji,{left:l,top:t});
      it.onclick=()=>{ sfx.pop(); it.classList.add('used'); const [x,y]=centerOf(it); sparkle(x,y);
        parts[n++].classList.add('show'); replay(pig); pig.classList.add('happy');
        bubble(pig,'꿀꿀!!',900,voice+'L');   // 우렁찬 꿀꿀
        if(n===parts.length){ sfx.yay(); const [hx,hy]=centerOf(h); sparkle(hx,hy);
          talk([{t:'다 지었다!',who:voice,onstart:()=>showBubble(pig,'다 지었다!')}],true); done(); } };
    });
  };
}
/* 공통 장면: 늑대가 후~ 불기 */
function blowScene(m, strong){
  return done=>{
    const h=house(m,'60%',true); const wolf=actor('🐺','8%','18%',true); wolf.classList.add('tapme');
    let n=0; const need=3;
    wolf.onclick=()=>{ if(n>=need) return; n++; sfx.blow(); const [x,y]=centerOf(wolf);
      bubble(wolf,'후우우~!',900,'wolf');
      for(let i=0;i<3;i++) setTimeout(()=>{ const w=el('div','wind','💨',{left:(x+40)+'px',top:(y-40+i*30)+'px'}); setTimeout(()=>w.remove(),1000); },i*120);
      replay(h); h.classList.add('shake');
      if(n===need){ wolf.classList.remove('tapme');
        setTimeout(()=>{
          if(!strong){ h.classList.add('fly'); tone(900,.6,'sine',-700);
            bubble(wolf,'하하하하!',1800,'wolf'); setTimeout(done,900); }
          else { tone(200,.5,'triangle',-100);
            const pigs=['40%','58%','76%'].map(l=>actor('🐷',l,'8%'));
            const laughs=[['히히히!','pig1'],['하하하!','pig2'],['호호호!','pig3']];
            // 늑대 대사 → 삼형제가 차례로 웃음
            talk([{t:'왜 안 날아가는 거야~~',who:'wolf',onstart:()=>showBubble(wolf,'왜 안 날아가는 거야~~',2400)},
              ...laughs.map(([t,who],i)=>({t,who,onstart:()=>{ replay(pigs[i]); pigs[i].classList.add('happy'); showBubble(pigs[i],t,1200); },
                onend:i===2?done:null}))]);
            setTimeout(done,9000); // 음성이 안 나오는 기기 대비
          } },700); }
    };
  };
}

/* ---------- 아기 돼지 삼형제 ---------- */
const PIGS=[
 {text:'옛날 옛날에 <b>아기 돼지 삼형제</b>가 살았어요.', hint:'👆 돼지들을 눌러서 인사해요!',
  after:'"안녕!" 삼형제는 각자 집을 짓기로 했어요.',
  play:done=>{ const names=['첫째','둘째','막내']; let met=new Set();
    ['22%','44%','66%'].forEach((l,i)=>{ const p=actor('🐷',l,'16%'); p.classList.add('tapme');
      p.style.fontSize=`clamp(${70-i*10}px,${13-i*1.5}vw,${130-i*15}px)`;
      p.onclick=()=>{ p.classList.remove('tapme'); replay(p); p.classList.add('happy'); const who='pig'+(i+1);
        showBubble(p,'꿀꿀!',900); met.add(i);
        talk([{t:'꿀꿀!',who},{t:`안녕! 나는 ${names[i]}야`,who,onstart:()=>showBubble(p,`안녕! 나는 ${names[i]}야`),
          onend:()=>{ if(met.size===3) done(); }}]); };
    }); }},
 {text:'첫째 돼지는 <b>지푸라기</b>로 집을 지었어요.', hint:'👆 지푸라기를 눌러요!', after:'짠! 폭신폭신 지푸라기 집 완성!',
  play:buildScene('straw','🌾','pig1')},
 {text:'둘째 돼지는 <b>나무</b>로 집을 지었어요.', hint:'👆 나무를 눌러요!', after:'짠! 튼튼한 나무 집 완성!',
  play:buildScene('wood','🪵','pig2')},
 {text:'막내 돼지는 <b>벽돌</b>로 집을 지었어요. 영차영차!', hint:'👆 벽돌을 눌러요!', after:'짠! 아주아주 튼튼한 벽돌 집 완성!',
  play:buildScene('brick','🧱','pig3')},
 {who:'wolf',text:'그때, 배고픈 <b>늑대</b>가 나타났어요! "지푸라기 집쯤이야!"', hint:'👆 늑대를 세 번 눌러요!',
  after:'휘이잉~ 지푸라기 집이 날아갔어요! 첫째는 둘째 집으로 도망갔어요.', play:blowScene('straw')},
 {who:'wolf',text:'늑대가 나무 집에 왔어요. "나무 집도 문제없지!"', hint:'👆 늑대를 세 번 눌러요!',
  after:'와르르! 나무 집도 날아갔어요! 돼지들은 막내의 벽돌 집으로 달려갔어요.', play:blowScene('wood')},
 {who:'wolf',text:'늑대가 벽돌 집에 왔어요. "후우~ 불어 볼까?"', hint:'👆 늑대를 세 번 눌러요!',
  after:'벽돌 집은 끄떡없어요! 늑대는 힘이 다 빠졌어요.', play:blowScene('brick',true)},
 {text:'돼지들이 다 함께 소리쳤어요. "늑대야, 저리 가!"', hint:'👆 돼지들을 눌러서 응원해요!',
  after:'늑대는 깜짝 놀라 멀리멀리 도망갔어요!',
  play:done=>{ house('brick','70%',true,.8); const wolf=actor('🐺','34%','14%',true); wolf.classList.add('runaway');
    let n=0; ['4%','14%','24%'].forEach((l,i)=>{ const p=actor('🐷',l,'10%'); p.classList.add('tapme');
      p.onclick=()=>{ if(p.dataset.done) return; p.dataset.done=1; sfx.oink(); p.classList.remove('tapme'); replay(p); p.classList.add('happy');
        bubble(p,'늑대야, 저리 가!',1600,'pig'+(i+1)); n++; wolf.style.left=(34+n*12)+'%';
        if(n===3){ setTimeout(()=>{ wolf.style.left='120%'; tone(600,.8,'sine',-500); },400); setTimeout(done,1600); } };
    }); }},
 {text:'아기 돼지 삼형제는 벽돌 집에서 <b>오래오래 행복하게</b> 살았대요. 끝!', hint:'👆 화면을 눌러서 축하해요!',
  after:'참 잘했어요! 🎉 다음 이야기에서 또 만나요!',
  play:done=>{ house('brick','50%',true,.9);
    ['22%','40%','70%'].forEach((l,i)=>{ const p=actor('🐷',l,'8%'); p.classList.add('dance'); p.style.animationDelay=i*.2+'s'; });
    let n=0; const layer=el('div','',null,{position:'absolute',inset:0});
    layer.onclick=e=>{ sfx.yay(); sparkle(e.clientX,e.clientY,'🎉⭐🎈💖🌟'); if(++n===3) done(); };
  }},
];
</script>
</body>
</html>
